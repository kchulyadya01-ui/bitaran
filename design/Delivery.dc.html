<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap">
  <style>
    body { margin:0; font-family:'IBM Plex Sans','Noto Sans Devanagari',system-ui,sans-serif; background:#f4f4f1; color:#16181a; -webkit-font-smoothing:antialiased; }
    a { color:#0a5c36; } a:hover { color:#074026; }
    .num { font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; letter-spacing:-0.01em; }
  </style>
</helmet>
<div style="width:390px; height:844px; display:flex; flex-direction:column; background:#f4f4f1; overflow:hidden;">

  <div style="position:relative; height:286px; background:#e4e2da; overflow:hidden;">
    <svg width="390" height="286" viewBox="0 0 390 286" style="display:block;">
      <rect x="0" y="0" width="390" height="286" fill="#e7e5dc"></rect>
      <g fill="#dedbd1">
        <rect x="24" y="28" width="72" height="54"></rect>
        <rect x="132" y="18" width="96" height="46"></rect>
        <rect x="262" y="36" width="86" height="64"></rect>
        <rect x="30" y="124" width="88" height="70"></rect>
        <rect x="156" y="112" width="70" height="58"></rect>
        <rect x="250" y="146" width="104" height="58"></rect>
        <rect x="56" y="228" width="120" height="46"></rect>
        <rect x="222" y="232" width="110" height="44"></rect>
      </g>
      <g stroke="#f7f6f2" stroke-width="13" stroke-linecap="square">
        <line x1="0" y1="102" x2="390" y2="96"></line>
        <line x1="0" y1="212" x2="390" y2="218"></line>
        <line x1="124" y1="0" x2="132" y2="286"></line>
        <line x1="240" y1="0" x2="236" y2="286"></line>
      </g>
      <g stroke="#f7f6f2" stroke-width="6">
        <line x1="0" y1="158" x2="390" y2="152"></line>
        <line x1="56" y1="0" x2="60" y2="286"></line>
        <line x1="330" y1="0" x2="326" y2="286"></line>
      </g>
      <path d="M58 250 L60 214 L128 208 L130 150 L196 146 L200 98 L268 94 L270 52" fill="none" stroke="#16181a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 9"></path>
      <path d="M58 250 L60 214 L128 208 L130 150" fill="none" stroke="#16181a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"></path>
      <g>
        <circle cx="58" cy="250" r="11" fill="#16181a"></circle>
        <path d="M53.5 250 l3 3.2 l6-6.4" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
        <circle cx="60" cy="214" r="11" fill="#16181a"></circle>
        <path d="M55.5 214 l3 3.2 l6-6.4" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
        <circle cx="130" cy="150" r="14" fill="#b3261e"></circle>
        <text x="130" y="155" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">3</text>
        <circle cx="196" cy="146" r="11" fill="#ffffff" stroke="#16181a" stroke-width="2.4"></circle>
        <text x="196" y="151" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600" fill="#16181a" text-anchor="middle">4</text>
        <circle cx="268" cy="94" r="11" fill="#ffffff" stroke="#16181a" stroke-width="2.4"></circle>
        <text x="268" y="99" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600" fill="#16181a" text-anchor="middle">5</text>
        <circle cx="270" cy="52" r="11" fill="#ffffff" stroke="#16181a" stroke-width="2.4"></circle>
        <text x="270" y="57" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600" fill="#16181a" text-anchor="middle">6</text>
      </g>
    </svg>
    <div style="position:absolute; top:14px; left:14px; display:flex; align-items:center; gap:6px; background:#ffffff; border:1px solid #c9c9c2; padding:7px 10px;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0a5c36" stroke-width="2.4" stroke-linecap="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      <span style="font-size:11px; font-weight:600;">Map cached for Bhaktapur</span>
    </div>
    <div style="position:absolute; bottom:14px; right:14px; width:48px; height:48px; background:#ffffff; border:1px solid #16181a; display:flex; align-items:center; justify-content:center; cursor:pointer;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#16181a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg>
    </div>
  </div>

  <div style="padding:14px 16px 10px; background:#ffffff; border-bottom:1px solid #d9d9d3; display:flex; align-items:center; justify-content:space-between; gap:10px;">
    <div style="display:flex; flex-direction:column; gap:3px;">
      <div style="font-size:16px; font-weight:600;">Today's route</div>
      <div class="num" style="font-size:12px; color:#6b6f76;">{{done}} of 6 done &middot; 11.4 km</div>
    </div>
    <div style="display:flex; align-items:center; gap:7px; border:1px solid #16181a; padding:9px 12px; cursor:pointer;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#16181a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3" y2="6"></line><line x1="3" y1="12" x2="3" y2="12"></line><line x1="3" y1="18" x2="3" y2="18"></line></svg>
      <span style="font-size:13px; font-weight:600;">Reorder</span>
    </div>
  </div>

  <div style="flex:1; overflow:hidden; display:flex; flex-direction:column; gap:1px; background:#d9d9d3;">
    <sc-for list="{{stops}}" as="s" hint-placeholder-count="4">
      <div style="{{s.rowStyle}}">
        <div style="{{s.pinStyle}}">{{s.n}}</div>
        <div style="flex:1; display:flex; flex-direction:column; gap:3px; min-width:0;">
          <div style="{{s.nameStyle}}">{{s.shop}}</div>
          <div class="num" style="font-size:11px; color:#6b6f76;">{{s.meta}}</div>
        </div>
        <div style="{{s.btnStyle}}" onClick="{{s.toggle}}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{s.tick}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: { 1:true, 2:true } };
  }
  renderVals() {
    const raw = [
      { n:1, shop:'Dattatreya Kirana', meta:'3,180 · cash collected' },
      { n:2, shop:'Byasi Chowk Shop', meta:'6,900 · credit' },
      { n:3, shop:'Thimi Fresh House', meta:'5,420 · 2.1 km · next stop' },
      { n:4, shop:'Kamalbinayak Store', meta:'2,240 · 2.8 km' },
      { n:5, shop:'Nyatapola Cold Store', meta:'12,400 · 3.6 km' },
      { n:6, shop:'Suryabinayak Traders', meta:'9,650 · 4.4 km' }
    ];
    const stops = raw.map((s) => {
      const on = !!this.state.done[s.n];
      const next = !on && s.n === 3;
      return {
        n: s.n,
        shop: s.shop,
        meta: s.meta,
        toggle: () => {
          const d = Object.assign({}, this.state.done);
          if (d[s.n]) { delete d[s.n]; } else { d[s.n] = true; }
          this.setState({ done: d });
        },
        rowStyle: 'background:' + (on ? '#f4f4f1' : '#ffffff') + '; padding:12px 14px; display:flex; align-items:center; gap:12px;',
        pinStyle: 'width:30px; height:30px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-family:IBM Plex Mono,monospace; font-size:13px; font-weight:600; background:' + (on ? '#c9c9c2' : (next ? '#b3261e' : '#16181a')) + '; color:#ffffff;',
        nameStyle: 'font-size:14.5px; font-weight:600; color:' + (on ? '#9aa0a6' : '#16181a') + '; text-decoration:' + (on ? 'line-through' : 'none') + '; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;',
        btnStyle: 'width:48px; height:48px; flex-shrink:0; display:flex; align-items:center; justify-content:center; cursor:pointer; border:1.5px solid ' + (on ? '#0a5c36' : '#c9c9c2') + '; background:' + (on ? '#0a5c36' : '#ffffff') + ';',
        tick: on ? '#ffffff' : '#c9c9c2'
      };
    });
    return { stops: stops, done: Object.keys(this.state.done).length };
  }
}
</script>
</body>
</html>
